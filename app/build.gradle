plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// Resolved from the repository root, so a repo-relative path such as
// -PplatformApiJar=platform-api.jar works from any module.
def platformApiJarProp = providers.gradleProperty('platformApiJar').orNull
def platformApiJar = platformApiJarProp != null ? rootProject.file(platformApiJarProp) : null

android {
    compileSdk 33
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "me.phh.ims"
        minSdk 32
        targetSdk 33
        // Bumped from upstream's 33: PackageManager will not re-scan a replaced
        // system APK that keeps the same versionCode, so every local rebuild that
        // changes the manifest needs this incremented. See samsung-calling.md §7.
        versionCode 68
        versionName "1.0"

        }
    sourceSets {
        main {
            jniLibs {
                srcDirs += "${projectDir}/jniLibs"
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path file('jni/CMakeLists.txt')
        }
    }
    namespace 'me.phh.ims'
}

if (platformApiJar != null) {
    // compileOnly (below) is enough for Kotlin, which takes the first match on
    // its compile classpath. javac does not see it: AGP passes the SDK's
    // android.jar as -bootclasspath, and javac searches the bootclasspath
    // before the classpath, so the public stubs win and sources touching
    // protected platform members (PhhMmTelFeatureProtected) fail to compile.
    // Prepend instead of replacing — the SDK jar still supplies java.*.
    tasks.withType(JavaCompile).configureEach { t ->
        t.doFirst {
            t.options.bootstrapClasspath =
                files(platformApiJar) + t.options.bootstrapClasspath
        }
    }
}

dependencies {
    if (platformApiJar != null) {
        // Host-side regression tests need the same private platform API
        // surface as the platform_apis Soong build. Supply a full platform
        // stub/classes jar without replacing the checked-in compatibility jar.
        compileOnly files(platformApiJar, 'libs/ImsMediaFramework.jar')
    } else {
        compileOnly fileTree(dir: 'libs', include: '*.jar')
    }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}
